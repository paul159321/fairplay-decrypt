name: Build FairPlay Credential Tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Credential Bundle

    runs-on: macos-15

    timeout-minutes: 30

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Check macOS and Xcode
      - name: Check build environment
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos --show-sdk-path

      # 3. Install ldid
      - name: Install dependencies
        run: |
          brew install ldid

          which ldid
          ldid -h || true

      # 4. Build iOS tools
      - name: Build credential retrieval tools
        run: |
          make -C credential-retrieval

      # 5. Verify generated files
      - name: Verify build
        run: |
          echo "Checking compiled files..."

          ls -lah credential-retrieval/build/bundle/

          test -s credential-retrieval/build/bundle/credential.ios
          test -s credential-retrieval/build/bundle/driver.ios
          test -s credential-retrieval/build/bundle/trigger.ios
          test -s credential-retrieval/build/bundle/static-key-table.bin
          test -s credential-retrieval/build/bundle/core4-word-table.bin

          echo "Checking binary architectures..."

          file credential-retrieval/build/bundle/*.ios

          echo "Build verification completed."

      # 6. Upload compiled files
      - name: Upload credential bundle
        uses: actions/upload-artifact@v4

        with:
          name: fairplay-credential-bundle

          path: credential-retrieval/build/bundle/

          if-no-files-found: error

          retention-days: 7
